### 1. Canvas教育プラットフォーム大規模侵害：2億7500万人分のデータ流出危機
**2026年5月**
ShinyHuntersグループによるInstructure（Canvas LMS）への攻撃が深刻化。米国中の学校・大学約9,000機関の学生・教職員2億7500万人分のデータ流出が脅かされている。同グループは過去8カ月で少なくとも3回の侵害を実行しており、今回は段階的エスカレーションの一環とみられる。
