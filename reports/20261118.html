## 🔴 Cyber Security

### 1. Optimizelyのホスト型スクリプト改ざん、BBC・CNN・Zoomなど178超のサイトでマルウェア配信
**2026年11月16〜17日**
攻撃者がOptimizely Experimentationのカスタムスクリプト機能を悪用して悪性JavaScriptを注入し、BBC、CNN、Zoom、Salesforce、Ledgerなど178〜186組織のサイトを経由して暗号資産アドレスすり替え（クリッパー）、カードスキマー、iOSエクスプロイトキットを配信した。信頼済みCDNから配信されたため検知が難しく、Ledgerなど暗号資産関連サイトも被害を受けた。17日にパッチとクリーンアップが行われたが、「OPTIMJACK」と名付けられた攻撃の続報が続いている。

🔗 [OPTIMJACK: Optimizely-hosted scripts crypto clipper & card skimmer (StepSecurity)](https://www.stepsecurity.io/blog/optimjack-optimizely-hosted-scripts-crypto-clipper-card-skimmer)
🔗 [At least 186 websites infected with malware, OPTIMJACK attacks are still ongoing (RootData)](https://www.rootdata.com/news/832527)

---

### 2. ConnectWise ScreenConnectの重大脆弱性CVE-2026-84869が積極悪用、MSPが標的に
**2026年11月17日**
MSP向けリモート管理ツールScreenConnectの重大脆弱性（CVSS 9.9）が悪用され、Huntressは技術者アカウント上で不正ファイルが実行される事例を報告。ワーム型マルウェア「SCKit」による不正クライアント展開も確認されている。サーバー側の更新だけでは不十分で、クライアントの更新も求められている。

🔗 [CVE-2026-84869 in ScreenConnect Exploited to Run Malicious Files on MSP Technician Accounts (Huntress)](https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation)
🔗 [Active ScreenConnect attacks breach MSPs, impact dozens of organizations (BleepingComputer)](https://bleepingcomputer.com/news/security/active-screenconnect-attacks-breach-msps-impact-dozens-of-organizations)

**2026年11月16〜17日**
理化学研究所が、スーパーコンピュータ「富岳」への不正アクセスを確認して運用を停止した。最大約4,600人の利用者情報やSSH秘密鍵が流出した可能性があり、窃取した認証情報で他のシステムも狙われたと報じられている。国家の研究基盤が侵害されたことで、研究活動への影響が懸念される。
