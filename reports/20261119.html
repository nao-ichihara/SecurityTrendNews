## 🔴 Cyber Security

### 1. VMware vCenterの認証バイパス（CVE-2026-123890）、中国系APTが9月からゼロデイ悪用
**2026年11月19日**
Broadcomが11月19日にパッチを公開したvCenterのCVSS 9.8認証バイパス脆弱性について、Mandiantは中国系APT「Armory Castle」（旧UNC5221）が9月以降ゼロデイとして悪用していたと報告した。BeyondTrustの0-dayで侵入した後、BONESAWツールで管理者セッションを取得し、SAML署名情報を盗み出していた。仮想化基盤を運用する組織は、至急パッチを当て、侵害の痕跡を調べる必要がある。

🔗 [Newly Patched VMware vCenter Flaw Exploited as Zero-Day by Chinese APT（SecurityWeek）](https://www.securityweek.com/newly-patched-vmware-vcenter-flaw-exploited-as-zero-day-by-chinese-apt/)
🔗 [CVE-2026-123890 vCenter Zero-Day Exploited（Cyber Kendra）](https://www.cyberkendra.com/2026/11/cve-2026-123890-vcenter-zero-day-exploited.html)

### 2. F5が「NGINX2Root」5件の重大RCEをパッチ、PoCも公開
**2026年11月18〜19日**
F5はNGINXに見つかった5件の未認証リモートコード実行脆弱性（CVSS 9.2、CVE-2026-123007ほか）を修正した。HTTP/2フロー制御の整数アンダーフローなど、10年以上潜んでいたバグが含まれる。PoCが既に公開されているため、悪用が確認される前でも即時の更新が推奨される。

🔗 [F5 Patches Critical NGINX2Root Flaws as PoC Exploits Go Public（SecurityWeek）](https://www.securityweek.com/f5-patches-critical-nginx2root-flaws-as-poc-exploits-go-public/)
🔗 [NGINX2Root NGINX vulnerabilities（Help Net Security）](https://www.helpnetsecurity.com/2026/11/19/nginx2root-nginx-vulnerabilities/)

---

### 3. 欧州委員会へのサイバー攻撃にAIレッドチームツール「ARTEX」使用か、HRシステムが10日以上停止
**2026年11月19日**
欧州委員会が10月下旬に検知した攻撃で、オープンソースのAIペネトレーションテスト基盤「ARTEX」が使われた可能性が高いと報じられた。給与・休暇管理のSysperなどHRシステムが10日以上停止し、CERT-EUは同様のAI駆動型攻撃に警戒を呼びかけている。広範なデータ流出の証拠は現時点で確認されていない。

### 5. エージェント型AI攻撃が拡大：ARTEX悪用の広がりとJadePufferによるAIモデル破壊
**2026年11月18〜19日**

## 🟡 Data & Privacy

### 6. PLAID「KARTE」侵害、DHC・三菱UFJ銀行・シャープなど数千万件規模の委託データが流出
**2026年11月18日（続報）**

## 🟢 Security Governance

### 8. CISAがKEVに4件追加、LiteLLMのLLMjacking脆弱性も対象に
**2026年11月18日**
CISAはSynology DSM（ランサムウェアで悪用）、BerriAI LiteLLM（CVE-2026-40217、LLMjacking）、Apache Axis、REDCapの4件を既知の悪用された脆弱性カタログ（KEV）に加えた。連邦機関には11月21日または12月2日までの修正が義務付けられた。AIゲートウェイの脆弱性がKEVに入ったことで、AI基盤も通常の脆弱性管理の対象として扱う必要がはっきりした。

🔗 [CISA Adds Four Known Exploited Vulnerabilities to Catalog（CISA）](https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog)
🔗 [CISA adds Synology, LiteLLM, Axis and REDCap flaws to KEV（Daily Security Review）](https://dailysecurityreview.com/resources/cisa-adds-synology-litellm-axis-and-redcap-flaws-to-kev-catalog/)
