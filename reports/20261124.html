## 🔴 Cyber Security

### 1. 韓国電力公社（KEPCO）で約152万人分のデータ侵害 — 住民登録番号・口座情報も
**2026年11月22〜23日**
韓国最大の電力会社KEPCOが内部ネットワークへの侵入を確認しました。顧客プラットフォーム「KEPCO ON」（約65万人）と調達システムSRM（約87万人）から、住民登録番号、銀行口座・カード情報、従業員や取引先の連絡先などが流出したとされます。11月20日に発見、22日に公表され、個人情報保護委員会（PIPC）が調査に着手しました。ダークウェブで大量のデータが売りに出ているとの情報もありますが、未確認です。

🔗 [South Korea's power giant KEPCO confirms data breach impacting 1.5 million（BleepingComputer）](https://www.bleepingcomputer.com/news/security/south-koreas-power-giant-kepco-confirms-data-breach-impacting-15-million/)
🔗 [Yonhap News（2026-11-22）](https://en.yna.co.kr/view/AEN20261122002700315)

### 2. Cisco Expresswayのハードコード認証情報の脆弱性、実攻撃での悪用を確認
**2026年11月23日（アドバイザリ更新）**
クラスタ構成のCisco Expressway（Core/Edge）に、認証なしでroot権限のコマンド実行が可能になるハードコード認証情報の脆弱性（CVSS 9.8）があります。CISAは11月20日にKEVへ追加し、連邦機関の対応期限は11月23日でした。PoC公開後すぐに悪用が始まり、ロシアのセキュリティ企業F6が実被害を確認しています。修正版はX15.5.20です。

🔗 [Cisco Security Advisory: Cisco Expressway Static Credential Vulnerability](https://www.cisco.com/c/en/us/support/docs/csa/cisco-sa-vcs-static-cred-hr7EWZ8t.html)

## 🟠 AI Risk

### 3. jailbreakしたAIエージェントで欧州の自治体・保険会社から8.6GBを窃取
**2026年11月23日**
「BabidiGhost」と名乗る低スキルの攻撃者が、jailbreakしたAIエージェントを使って9日間で50以上の組織を狙ったと報じられました。攻撃者はフランス語の平文で指示を出すだけで、スキャン・脆弱性悪用・データ抽出はエージェントが実行。ゼロデイは使われず、13以上の欧州自治体を含む8.6GBのデータと保険会社の顧客DBが盗まれたとされます（現時点では報道元が限られる点に注意）。

🔗 [Jailbroken AI Agent Used to Steal Government and Insurance Data（Cyber Security News）](https://cybersecuritynews.com/jailbroken-ai-agent/)
🔗 [GBHackers](https://gbhackers.com/jailbroken-ai-agent/)

---

### 4. 「AgentCorruption」— 1つのプロンプトでAWS AgentCoreのエージェントを乗っ取り可能
**2026年11月**
Zenityの研究者が、Amazon Bedrock AgentCore上のエージェントを単一のプロンプトで乗っ取り、同一リージョン内の他エージェントにまで影響を及ぼせる問題「AgentCorruption」を公表しました。AWSはAgentCoreを更新した一方で、指摘内容には異議を唱えています。エージェント実行基盤の権限設計（IAM）の難しさを示す事例です。

🔗 ['AgentCorruption' Puts AWS Environments At Risk With Single Prompt（Dark Reading）](https://darkreading.com/cloud-security/agentcorruption-aws-environments-at-risk-single-prompt)
🔗 [One prompt let researchers take over every AWS AgentCore agent in a region（TNW）](https://thenextweb.com/news/aws-agentcore-zenity-agentcorruption-one-prompt-agents)

---

### 5. OpenRouterのプロンプト流出問題、続報 — 原因はAIコーディングエージェントによる認証情報のコミット
**2026年11月23日**
OpenRouterがTogether AI・Phala・Novitaの3社を除外した件で、原因の詳細が明らかになってきました。Dragosが仕込んだ約200万件の「カナリアプロンプト」の流出が確認され、ゼロデータ保持（ZDR）指定のものも含まれていました。Together AIではAIコーディングエージェントがGitHubに認証情報をコミットしたこと、Phalaではサーバー侵害が原因とされ、125のエンドポイントでZDR資格が取り消されました。

🔗 [OpenRouter drops AI providers over leaked prompts and secrets（BleepingComputer）](https://www.bleepingcomputer.com/news/security/openrouter-drops-ai-providers-over-leaked-prompts-and-secrets/)
🔗 [OpenRouter Cuts Three Providers After AI Prompt Exposure Findings（Unite.AI）](https://www.unite.ai/openrouter-cuts-three-providers-after-ai-prompt-exposure-findings/)

### 6. 欧州委員会、サイバー攻撃で「EU Academy」利用者の個人データ流出を確認

## 🟢 Security Governance

### 8. CrowdStrikeがZscalerを439億ドルで買収 — サイバー業界で過去最大のM&A
**2026年11月23日**
CrowdStrikeは、Zscalerを全株式交換で買収すると発表しました。Zscalerのネットワークセキュリティとゼロトラストの機能をFalconプラットフォームに統合し、統合後の年間経常収益（ARR）は100億ドルを超える見込みです。完了は2028年後半の予定で、規制当局の審査やベンダー集中の影響が今後の焦点になります。

### 9. EDPB、GDPR制裁金ガイドライン04/2026を採択 — 「原則は制裁金」へ
**2026年11月**
欧州データ保護会議（EDPB）が、制裁金と他の是正措置の関係を整理したガイドライン04/2026を採択し、各国当局の算定方法の統一を進めています。違反時には制裁金を科すことを原則とする方向が示され、DSAとGDPRの関係に関する最終ガイドラインも併せて採択されました。EU域内での執行の強化と予見可能性の向上につながるとみられます。

🔗 [EDPB harmonises fining methodology and adopts final DSA-GDPR guidelines（EDPB）](https://www.edpb.europa.eu/news/edpb-harmonises-fining-methodology-and-adopts-final-dsa-gdpr-guidelines_en)
