**2026年7月8日〜9日**
ハッカー「888」がサイバー犯罪フォーラムでAccentureから約35GBのソースコード、RSA/SSHキー、Azureアクセスキー等を窃取したと主張。同社は「隔離された事案」として侵害を確認し、原因を除去済みと発表。事業への影響はないとしている。

**2026年7月14日**
