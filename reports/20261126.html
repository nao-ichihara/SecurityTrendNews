## 🔴 Cyber Security

### 1. 米財務省FinCENがサイバーインシデントでシステムを切り離し、CIAの非機密システムでも侵害
**2026年11月24〜25日**
米財務省の金融犯罪取締ネットワーク（FinCEN）は、一部システムへの不正アクセスを受けてシステムをネットワークから切り離した。同時期に、CIAの非機密のOSINT分析系システムが侵害されたとAP通信が関係者の話として報じた。FBIのネットワーク侵害が「重大インシデント」に指定されたばかりで、米政府機関への侵害が連鎖している。データ流出の範囲は明らかになっていない。

🔗 [FBI Classifies Breach of Its Networks as Major Incident（PYMNTS）](https://www.pymnts.com/cybersecurity/2026/fbi-classifies-breach-of-its-networks-as-major-incident/)

### 2. Elixir/Erlangのパッケージレジストリ「Hex.pm」、CVSS 10.0のRCEが悪用され本番サーバー6台が侵害
**2026年11月25日**
報道によると、Hex.pmで2016年から残っていたOSコマンド実行の脆弱性（CVSS 10.0）が悪用され、本番サーバー6台でコマンドが実行された。攻撃は13分間に69件のリクエストで行われ、運営側は約15分でパッチを適用した。利用者のメールアドレス、パスワードハッシュ、2FAのシークレットが漏れた可能性があり、パッケージ公開者にはトークンの再発行などが求められる。

🔗 [The Hacker News](https://thehackernews.com/)
🔗 [Cyware Daily Threat Intelligence, November 25, 2026（Cyware）](https://www.cyware.com/resources/threat-briefings/daily-threat-briefing/cyware-daily-threat-intelligence-november-25-2026)

### 3. Palo Alto、ファイアウォールのroot奪取に使われたLinuxカーネルの欠陥「Fragnesia」を修正
**2026年11月25日**
中国系とみられるグループが、PAN-OSの管理インターフェースの脆弱性「PHP2Shell」とLinuxカーネルの権限昇格バグ「Fragnesia」を組み合わせ、管理画面がインターネットに公開されたファイアウォール約25台でroot権限を取得した。CISAはこの欠陥をKEVに追加し、連邦機関に短期間での対応を命じた。管理インターフェースを外部に公開しないことが改めて求められている。

🔗 [Palo Alto Networks Patches Fragnesia Flaw Used to Root Firewalls（SecurityWeek）](https://www.securityweek.com/palo-alto-networks-patches-fragnesia-flaw-used-to-root-firewalls/)

### 4. GeoServerの新たな脆弱性2件が攻撃に悪用、既存の欠陥と組み合わせて未認証RCEが可能に
**2026年11月25日**
地理空間データ配信サーバーGeoServerで新たに公表された脆弱性2件（CVE-2026-120705、CVE-2026-129243）に対する攻撃が始まった。他の脆弱性と組み合わせると認証なしでリモートコード実行が可能になり、watchTowrが攻撃の試行を確認している。政府機関や電力・水道などで広く使われ、インターネットに公開されたインスタンスは3,000を超える。

## 🟠 AI Risk

### 5. イタリアとスイスが自律型AIによるサイバー攻撃を警告 — ARTEXなどのエージェントで重要インフラを数時間で侵害
**2026年11月23〜25日**
イタリアのCSIRTとスイスのNCSCは、ARTEXやCyberStrikeAIといったAIエージェント型の攻撃フレームワークによる自律的な攻撃を国内で確認したと警告した。重要インフラを含む複数組織が数時間のうちに大規模に侵害されたという。FBIも11月18日にARTEXが重要分野への攻撃を自動化していると警告しており、Wizの調査では悪用されるエージェントの数が10月から倍近くに増えている。

### 6. CiscoとOpenAIが「Shirudo」を発表 — AIエージェントが未パッチのLinuxを再起動なしで一時防御
**2026年11月24日**
CiscoとOpenAIは、AIエージェントが脆弱性情報からeBPFベースの一時的な防御ルール（シールド）を自動生成し、パッチ未適用のLinuxシステムを再起動なしで守るツール「Shirudo」を発表した。社内テストではJavaやPHPの脆弱性を狙う攻撃を防いだという。攻撃側のAIで悪用までの時間が短くなる中、パッチ適用までの空白を埋める手段として注目される。

🔗 [New Shirudo tool uses AI to shield unpatched Linux systems from exploits（BleepingComputer）](https://www.bleepingcomputer.com/news/linux/new-shirudo-tool-uses-ai-to-shield-unpatched-linux-systems-from-exploits/)

## 🟡 Data & Privacy

### 7. 1Password、従業員のGitHubアカウント侵害で顧客データが流出 — 保管庫と暗号鍵は無事
**2026年11月25日**
1Passwordは、従業員の企業用GitHubアカウントが侵害され、バックエンドに悪意あるコードが仕込まれた結果、顧客の氏名、メールアドレス、一部のトークンなどが盗まれたと公表した。パスワード保管庫（Vault）の中身と暗号鍵は影響を受けていないとしている。流出した連絡先を使った精巧なフィッシングが予想され、同社を装う「侵害通知」メールに注意が必要だ。6月のLastPass（Klue経由）に続き、パスワード管理サービスの周辺システムからの流出が続いている。

🔗 [1Password customer data stolen after employee GitHub account breach（BleepingComputer）](https://www.bleepingcomputer.com/news/security/1password-customer-data-stolen-after-employee-github-account-breach/)
🔗 [1Password data breach（The Verge）](https://www.theverge.com/tech/1042409/1password-data-breach-leak)
