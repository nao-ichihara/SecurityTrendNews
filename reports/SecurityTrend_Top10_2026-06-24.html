## 🔴 Cyber Security

### 1. SSHライブラリ「libssh2」に認証不要のRCE脆弱性（CVE-2026-55200）
**2026年6月17日公表**
広く組み込まれているクライアント側SSHライブラリlibssh2に、CVSS 9.2の重大な整数オーバーフロー脆弱性が発見された。\`ssh2_transport_read()\`内のパケット長検証不足が原因で、特権・ユーザー操作不要のリモートコード実行が可能。1.11.1以前の全バージョンが対象で、関連するDoS脆弱性（CVE-2026-55199、CVSS 8.2）も同時に公表された。

🔗 [Critical flaw in popular SSH library enable hackers hijack systems remotely](https://cybernews.com/security/libssh2-critical-vulnerability-enables-rce/)

### 2. 29年前のコードに起因する「Squidbleed」、Squidプロキシから資格情報が漏洩（CVE-2026-47729）
**2026年6月**
1997年のFTPパース処理に起因するヒープオーバーリード脆弱性がSquid Proxyのデフォルト設定で発見された。攻撃者が制御するFTPサーバーへディレクトリ一覧を取得させることで、他ユーザーのHTTP Authorizationヘッダーやセッショントークンが漏洩する。Squid 7.6では修正が未反映だったことも判明し、正式パッチは7.7で提供予定。

🔗 [29-Year-Old Squid Proxy Bug 'Squidbleed' Can Leak Cleartext HTTP Requests](https://thehackernews.com/2026/06/29-year-old-squid-proxy-bug-squidbleed.html)
