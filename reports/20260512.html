## 🔴 Cyber Security

### 1. Canvas（Instructure）大規模侵害：学生・教職員2億7500万件のデータ流出
**2026年5月上旬**

教育LMSの最大手Instructureが、ShinyHuntersランサムウェアグループによるクラウド環境への不正侵入を公式確認した。盗まれたとされるデータは学生・教職員・スタッフに関連する約2億7500万件で、8,809の学区・大学・オンライン教育プラットフォームが影響を受けたとされる。教育分野を狙うサイバー攻撃の深刻さを改めて浮き彫りにした事件だ。

🔗 [Canvas hack exposes schools' vulnerability to cyberattacks - The Washington Post](https://www.washingtonpost.com/education/2026/05/09/canvas-school-hack-trend/)

🔗 [Millions of students' personal data stolen in major education breach - Malwarebytes](https://www.malwarebytes.com/blog/news/2026/05/millions-of-students-personal-data-stolen-in-major-education-cyberattack)

### 2. SharePointゼロデイ（CVE-2026-32201）：リモートコード実行の脆弱性が積極悪用中
**2026年5月**

Microsoft SharePointにリモートコード実行（RCE）を可能にするゼロデイ脆弱性（CVE-2026-32201）が発見され、すでに野外（in-the-wild）での積極的な悪用が確認されている。企業のイントラネット環境に広く普及するSharePointを標的とした本脆弱性は、迅速なパッチ適用が不可欠とされている。

🔗 [Supply Chain Attacks, AI Security, and Major Breaches Define This Week in Cybersecurity - eSecurity Planet](https://www.esecurityplanet.com/weekly-roundup/supply-chain-attacks-ai-security-and-major-breaches-define-this-week-in-cybersecurity-in-may-2026/)

**2026年5月**

🔗 [CISA Adds Actively Exploited Linux Root Access Bug CVE-2026-31431 to KEV - The Hacker News](https://thehackernews.com/2026/05/cisa-adds-actively-exploited-linux-root.html)

## 🟡 Data & Privacy

### 9. コネチカット州、データブローカー規制法SB4を141対6で可決
**2026年5月4日**

コネチカット州下院が、データブローカーの情報利用を制限し消費者がネット上の個人情報を削除できる権利を付与するSB4（上院法案4）を141対6の圧倒的賛成多数で可決した。2023年制定のコネチカット・データプライバシー法を強化するもので、遺伝情報・個人データへの保護も強化される。米国では19州が包括的消費者プライバシー法を整備済みであり、州主導の規制強化が続いている。

🔗 [Consumer data privacy bill gets final passage in CT House - CT Mirror](https://ctmirror.org/2026/05/04/consumer-data-privacy-regulation-ct-house/)

**2026年5月**
