## 🔴 Cyber Security

### 1. FBIの全米犯罪情報センター（NCIC）データベースに侵害の疑い
**2026年11月20〜21日**
CNNの報道によると、令状・犯罪歴・身元調査の情報を全米の法執行機関が共有するFBIのNCICが侵害された疑いがあります。9月の求人ポータル侵害に続く2度目の事案で、漏えいの範囲やデータの種類はまだ確認されておらず、調査が続いています。警察の日常業務を支える基盤だけに、政策面への波及も大きいとみられます。

**2026年11月21日**
