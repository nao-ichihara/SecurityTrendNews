## 🔴 Cyber Security

### 1. OpenSSHの「SSHole」脆弱性が公開直後から悪用　CISAも実攻撃を確認
**2026年11月12日〜14日**
musl libcを使いPAMを使わないOpenSSH環境（Alpine Linuxやそれをベースにしたコンテナイメージなど）で、パスワード認証を回避してログインできる脆弱性「SSHole」（CVE-2026-123158）が公開され、数時間〜約40時間で悪用が始まりました。ハニーポットではroot権限が奪取されており、CISAも悪用を確認しています。修正版はOpenSSH 10.6p2です。Alpineベースのイメージを棚卸しし、パッチ適用・再ビルドとあわせて、パスワード認証の無効化（鍵認証のみにする）を急ぐ必要があります。

🔗 [Hackers exploit SSHole OpenSSH flaw to breach Linux systems（BleepingComputer）](https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/)
🔗 [Hackers Target OpenSSH SSHole Flaw Within Hours of Disclosure, Gain Root on Honeypot（The Hacker News）](https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html)
🔗 [CISA Confirms Hackers are Exploiting SSHole（Cybersecurity News）](https://cybersecuritynews.com/hackers-exploiting-sshole-the-openssh-bug/)

### 2. Operation Endgame、Gootloader・CastleRAT・StealCのインフラを解体　640万件の窃取認証情報を確保
**2026年11月12日〜13日**
Europolが主導する国際作戦「Operation Endgame」の新たなフェーズで、ドロッパーのGootloader、RATのCastleRAT、情報窃取型マルウェアStealCのインフラが解体されました。サーバー235台とドメイン257件を押収し、640万件分の被害者認証情報を確保しています。いずれもランサムウェア攻撃の初期侵入に使われてきたマルウェアです。確保した認証情報は今後、被害者への通知や漏えいチェックサービスへの提供につながる見込みです。

🔗 [6.4 million victim datasets secured in international operation against malware networks（Europol）](https://www.europol.europa.eu/media-press/newsroom/news/64-million-victim-datasets-secured-in-international-operation-against-malware-networks)
🔗 [International operation dismantles malware networks, exposes 6.4 million stolen credentials（CyberScoop）](https://cyberscoop.com/operation-endgame-malware-takedown-gootloader-stealc-europol/)

### 3. N-able N-centralのゼロデイ「4EverAble2Shell」　Hotfix 3はまだ提供されず（続報）
**2026年11月13日〜15日**
RMM製品N-centralで、未認証のままroot権限でリモートコード実行に至る攻撃チェーン「4EverAble2Shell」が、PoC公開から約5時間で悪用されました。少なくとも21台のサーバーにXMRigマイナーが設置され、そのうち19台は最新のHotfix 2を適用済みでした。恒久的な修正（Hotfix 3）が出るまでは、Legacy APIの無効化が唯一の有効な緩和策です。MSP経由で多数の顧客へ被害が広がるおそれがあるため、引き続き警戒が必要です。

🔗 [Hackers Exploit New N-central Zero-Day Hours After PoC Publication（SecurityWeek）](https://www.securityweek.com/hackers-exploit-new-n-central-zero-day-hours-after-poc-publication/)
