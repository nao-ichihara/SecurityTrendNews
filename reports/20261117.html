## 🔴 Cyber Security

### 1. Optimizelyの脆弱性悪用で178組織のWebサイトにマルウェア　BBC・HSBC・Ledgerなどが被害
**2026年11月17日**
攻撃者がWeb最適化プラットフォームOptimizelyの脆弱性を悪用し、顧客がサイトに埋め込むカスタムJavaScriptに不正コードを注入した。信頼済みCDN経由で、BBC、HSBC、Ledgerなど178組織のサイト訪問者に暗号資産アドレスのすり替え（クリッパー）、カードスキマー、iOS向けエクスプロイトキットが配信されたと報じられている。Optimizelyはパッチと除去を実施済みだが、サードパーティ・スクリプトの改ざん監視（CSP、SRI等）の重要性を改めて示す事案となった。

🔗 [Optimizely Vulnerability Exploited to Serve Malware on Major Websites（SecurityWeek）](https://www.securityweek.com/optimizely-vulnerability-exploited-to-serve-malware-on-major-websites/)

🔗 [World's Largest Brands Infected With Malware Via Optimizely（Report URI）](https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/)

**2026年11月17日**
